<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173d2f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Bob — HDOS</title>
</head>
<body>
  <main class="app">
    <header><div class="brand">B</div><div><h1>Bob</h1><p>Hicks Directional Drilling</p></div></header>
    <section class="card">
      <h2>Start today’s drilling record</h2>
      <label>Project<input id="project" value="Romney" /></label>
      <label>Morning page numbers<input id="pages" placeholder="Example: 186, 187" /></label>
      <button id="startDay">Start Day</button><p id="startStatus" class="status"></p>
    </section>
    <section class="card">
      <h2>End of day</h2>
      <label>Total footage<input id="footage" inputmode="numeric" placeholder="Example: 1137" /></label>
      <label>Pedestals installed<input id="peds" inputmode="numeric" placeholder="0" /></label>
      <label>Field notes<textarea id="notes" rows="6" placeholder="Bores, stubs, crossings, pedestal locations…"></textarea></label>
      <label>Photos<input id="photos" type="file" accept="image/*" multiple /></label>
      <button id="saveDay">Save Day</button><p id="saveStatus" class="status"></p>
    </section>
    <section class="card"><h2>Saved record</h2><pre id="savedRecord">No record saved yet.</pre></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
