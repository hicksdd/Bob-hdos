<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d2f"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
<title>Bob — HDOS v5.3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body><main class="app">
<header><div class="brand">B</div><div><h1>Bob</h1><p>Hicks Directional Drilling</p></div><span id="cloudStatus">Checking cloud…</span></header>
<nav class="tabs"><button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="projects">Projects</button><button class="tab" data-tab="setup">Setup</button></nav>
<section id="today" class="panel active"><div class="card"><h2>Today’s Assignment</h2><label>Project<select id="projectSelect"><option value="">Choose project</option></select></label><label>Morning page numbers<input id="assignedPages"></label><button id="startDay">Start Day</button><p id="startStatus"></p></div></section>
<section id="projects" class="panel"><div class="card"><h2>Project Library</h2><label>Manage project<select id="libraryProjectSelect"><option value="">Choose project</option></select></label><div id="selectedProjectPanel" class="hidden"><label>DFN name<input id="dfnName" placeholder="DFN 2"></label><label>Revision<input id="dfnRevision" placeholder="Original / Rev A"></label><label>DFN PDF parts<input id="dfnFiles" type="file" accept="application/pdf,.pdf" multiple></label><div id="dfnMeta"></div><button id="uploadDfn">Upload DFN Revision</button><p id="dfnStatus"></p><h3>DFN Library</h3><div id="documentList"></div></div></div></section>
<section id="setup" class="panel"><div class="card"><h2>Bob v5.3 Setup</h2><p>Run supabase-v5-3-setup.sql once, then expose project_document_parts in Data API settings.</p><button id="testCloud">Test v5.3 Connection</button><p id="testResult"></p></div></section>
</main><script src="config.js"></script><script src="app.js"></script></body></html>
