<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d2f"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"><title>Bob — HDOS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="app"><header><div class="brand">B</div><div><h1>Bob</h1><p>Hicks Directional Drilling</p></div><span id="cloudStatus" class="cloud offline">Checking cloud…</span></header><nav class="tabs"><button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="projects">Projects</button><button class="tab" data-tab="history">History</button><button class="tab" data-tab="setup">Setup</button></nav>
<section id="today" class="panel active"><section class="card"><h2>Today’s assignment</h2><label>Project<select id="projectSelect"><option value="">Choose project</option></select></label><label>Morning page numbers<input id="assignedPages" placeholder="Example: 6, 7, 8"></label><button id="startDay">Start Day</button><p id="startStatus" class="status"></p></section><section class="card"><h2>End of day</h2><label>Actual pages worked<input id="actualPages"></label><label>Total footage<input id="totalFootage" inputmode="numeric"></label><div class="section-head"><h3>Bores</h3><button class="small secondary" id="addBore" type="button">+ Add bore</button></div><div id="bores"></div><label>Pedestals installed<input id="pedestals" inputmode="numeric" value="0"></label><label>Pedestal locations<textarea id="pedLocations" rows="3"></textarea></label><label>General notes<textarea id="notes" rows="4"></textarea></label><label>Jobsite photos<input id="dayPhotos" type="file" accept="image/*" multiple></label><div id="dayPhotoPreview" class="photo-preview"></div><div id="footageCheck" class="check neutral">Add bore footage to compare against the daily total.</div><button id="saveDay">Save Completed Day</button><p id="saveStatus" class="status"></p></section></section>
<section id="projects" class="panel"><section class="card"><h2>Create project and upload DFN</h2><label>Project name<input id="newProjectName"></label><label>Contractor<input id="contractor" value="Martin Irrigation"></label><label>Full DFN map package (PDF)<input id="dfnFile" type="file" accept="application/pdf"></label><label>Martin production-sheet template<input id="productionTemplate" type="file" accept=".xlsx,.xls,.pdf"></label><button id="createProject">Create Project & Upload Files</button><p id="projectStatus" class="status"></p></section><section class="card"><div class="section-head"><h2>Projects</h2><button class="small secondary" id="refreshProjects">Refresh</button></div><div id="projectList"></div></section></section>
<section id="history" class="panel"><section class="card"><div class="section-head"><h2>Cloud history</h2><button class="small secondary" id="refreshHistory">Refresh</button></div><div id="historyList"></div></section></section>
<section id="setup" class="panel"><section class="card"><h2>Bob setup</h2><p>Run <strong>supabase-v5-setup.sql</strong> once in Supabase SQL Editor before using Projects.</p><button id="testCloud">Test Projects Connection</button><p id="testResult" class="status"></p></section></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
