<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#173d2f'><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='icon-192.png'><link rel='stylesheet' href='styles.css'><title>Bob — HDOS</title></head><body><main class='app'><header><div class='brand'>B</div><div><h1>Bob</h1><p>Hicks Directional Drilling</p></div></header><nav class='tabs'><button class='tab active' data-tab='today'>Today</button><button class='tab' data-tab='history'>History</button></nav><section id='today' class='panel active'><section class='card'><h2>Start today’s drilling record</h2><label>Project<input id='project' value='Romney'></label><label>Morning page numbers<input id='pages' placeholder='Example: 186, 187'></label><button id='startDay'>Start Day</button><p id='startStatus' class='status'></p></section><section class='card'><h2>End of day</h2><label>Actual pages worked<input id='actualPages' placeholder='Example: 186, 187'></label><label>Total footage<input id='footage' inputmode='numeric' placeholder='Example: 1137'></label><div class='section-head'><h3>Bores</h3><button class='small secondary' id='addBore'>+ Add bore</button></div><div id='bores'></div><label>Pedestals installed<input id='peds' inputmode='numeric' placeholder='0'></label><label>Pedestal locations<textarea id='pedLocations' rows='3'></textarea></label><label>General notes<textarea id='notes' rows='4'></textarea></label><label>Photos<input id='photos' type='file' accept='image/*' multiple></label><div id='footageCheck' class='check neutral'>Add bore footage to compare against the daily total.</div><button id='saveDay'>Save Completed Day</button><p id='saveStatus' class='status'></p></section><section class='card'><h2>Current record</h2><pre id='savedRecord'>No record saved yet.</pre></section></section><section id='history' class='panel'><section class='card'><div class='section-head'><h2>Daily history</h2><button class='small danger' id='clearHistory'>Clear history</button></div><div id='historyList'></div></section></section></main><script src='app.js'></script></body></html>
